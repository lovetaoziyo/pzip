[package]
name = "pzip-com-server"
version = "0.1.0"
description = "PZip Windows 11 context menu COM server (IExplorerCommand)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }
windows-core = "0.58"
